name: workgraph

x-application: &application
  image: ${WORKGRAPH_IMAGE:-gitmora:local}
  build:
    context: .
    dockerfile: deploy/Dockerfile
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
  networks: [private]
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-runtime: &runtime
  <<: *application
  env_file:
    - ${WORKGRAPH_STATE_DIR:?Set a private absolute installation directory}/runtime.env
  environment:
    WORKGRAPH_DATABASE_URL_FILE: /run/secrets/database_url
  secrets: [database_url, encryption_keys, oidc_client_secret]
  restart: unless-stopped
  depends_on:
    migrate: {condition: service_completed_successfully}

services:
  postgres:
    image: ${GITMORA_POSTGRES_IMAGE:-gitmora-postgres:18.6-security1}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets: [postgres_password, app_password]
    volumes:
      - database:/var/lib/postgresql
      - ./deploy/postgres/10-workgraph.sql:/docker-entrypoint-initdb.d/10-workgraph.sql:ro
    networks: [private]
    shm_size: 128m
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, postgres, -d, postgres]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    <<: *application
    command: [migrate]
    environment:
      WORKGRAPH_DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *runtime
    command: [serve, --listen, "0.0.0.0:8080"]
    healthcheck:
      test: [CMD, /gitmorad, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  gateway:
    <<: *application
    command: [gateway, --listen, "0.0.0.0:8080", --upstream, "http://api:8080"]
    networks: [private, ingress]
    ports: ["127.0.0.1:${WORKGRAPH_HTTP_PORT:-8080}:8080"]
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, /gitmorad, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    <<: *runtime
    command: [worker]
    # This process has no host ports or API ingress; durable job state remains in PostgreSQL.
    secrets: [database_url, encryption_keys]

volumes:
  database:

networks:
  private:
    internal: true
  ingress:

secrets:
  database_url:
    file: ${WORKGRAPH_STATE_DIR:?}/secrets/database_url
  postgres_password:
    file: ${WORKGRAPH_STATE_DIR:?}/secrets/postgres_password
  app_password:
    file: ${WORKGRAPH_STATE_DIR:?}/secrets/app_password
  encryption_keys:
    file: ${WORKGRAPH_STATE_DIR:?}/secrets/encryption_keys
  oidc_client_secret:
    file: ${WORKGRAPH_STATE_DIR:?}/secrets/oidc_client_secret
