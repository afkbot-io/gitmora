# Selected same-host identity origin: preserve its HTTPS hostname while dialing only the private host gateway.
# This profile supplies its own private subnet. It does not enable OIDC or mount a secret in the worker.
services:
  api:
    extra_hosts:
      - "${GITMORA_PUBLIC_HOST:?Set GITMORA_PUBLIC_HOST in the private compose.env}:${GITMORA_PRIVATE_GATEWAY:-172.30.88.1}"

# The identity route works on its own private subnet.
networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: ${GITMORA_PRIVATE_SUBNET:-172.30.88.0/24}
          gateway: ${GITMORA_PRIVATE_GATEWAY:-172.30.88.1}
