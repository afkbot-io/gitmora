# One explicit self-managed provider. Store these non-secret policy values in the installation compose.env.
# See docs/tasktopia.md; API/worker retain their internal-only network and end-to-end TLS.
services:
  api:
    environment:
      WORKGRAPH_TASKTOPIA_ALLOWLIST: ${GITMORA_TASKTOPIA_URL:?Set the exact HTTPS Tasktopia /mcp endpoint}
      WORKGRAPH_TASKTOPIA_PROXY_URL: http://tasktopia-egress:8080
    depends_on:
      tasktopia-egress: {condition: service_healthy}
  worker:
    environment:
      WORKGRAPH_TASKTOPIA_ALLOWLIST: ${GITMORA_TASKTOPIA_URL:?Set the exact HTTPS Tasktopia /mcp endpoint}
      WORKGRAPH_TASKTOPIA_PROXY_URL: http://tasktopia-egress:8080
    depends_on:
      tasktopia-egress: {condition: service_healthy}
  tasktopia-egress:
    image: ${WORKGRAPH_IMAGE:-gitmora:local}
    command: [egress, --listen, "0.0.0.0:8080", --target, "${GITMORA_TASKTOPIA_AUTHORITY:?Set the exact Tasktopia host:port}", --visibility, "${GITMORA_TASKTOPIA_VISIBILITY:-private}"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    networks: [private, tasktopia_outbound]
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    stop_grace_period: 10s
    restart: unless-stopped
    healthcheck:
      test: [CMD, /gitmorad, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  tasktopia_outbound:
