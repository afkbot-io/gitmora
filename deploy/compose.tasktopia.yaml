# Explicit same-host routing for the selected Tasktopia installation; application networks retain no default egress.
services:
  api:
    extra_hosts:
      - "${GITMORA_TASKTOPIA_HOST:-tasktopia.online}:${GITMORA_PRIVATE_GATEWAY:-172.30.88.1}"
  worker:
    extra_hosts:
      - "${GITMORA_TASKTOPIA_HOST:-tasktopia.online}:${GITMORA_PRIVATE_GATEWAY:-172.30.88.1}"

networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: ${GITMORA_PRIVATE_SUBNET:-172.30.88.0/24}
          gateway: ${GITMORA_PRIVATE_GATEWAY:-172.30.88.1}
