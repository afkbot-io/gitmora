# Explicit activation after the provider, private route and RP file secret have been verified.
# Keep these settings out of shared runtime.env: ordinary workers do not need identity configuration.
services:
  api:
    environment:
      WORKGRAPH_PUBLIC_URL: https://${GITMORA_PUBLIC_HOST:?Set GITMORA_PUBLIC_HOST in the private compose.env}
      WORKGRAPH_OIDC_ISSUER: https://${GITMORA_PUBLIC_HOST:?Set GITMORA_PUBLIC_HOST in the private compose.env}/auth/realms/${GITMORA_REALM:-gitmora}
      WORKGRAPH_OIDC_CLIENT_ID: ${GITMORA_CLIENT_ID:-gitmora}
      WORKGRAPH_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
