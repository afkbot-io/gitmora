# Optional CPU-only semantic retrieval. Provision the model cache before starting.
# No model/API ports are published; runtime inference has no external network.
services:
  embeddings:
    image: ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    command: [serve]
    environment:
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "32"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${WORKGRAPH_STATE_DIR:?}/embedding-models:/root/.ollama
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,mode=1777"]
    networks: [private]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  embedding-worker:
    image: ${WORKGRAPH_IMAGE:-gitmora:local}
    command: [embedding-worker]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - ${WORKGRAPH_STATE_DIR:?}/runtime.env
    environment:
      WORKGRAPH_DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    networks: [private]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      embeddings: {condition: service_started}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
