# Fill GITMORA_GITHUB_ENTERPRISE_* in the installation compose.env and select this overlay.
# Keep compose.github-com.yaml for independent GitHub.com access.
services:
  api:
    environment:
      WORKGRAPH_GITHUB_ENABLED: "true"
      WORKGRAPH_GITHUB_ALLOWLIST: ${GITMORA_GITHUB_ENTERPRISE_URL:?Set the exact Enterprise HTTPS web base}
      WORKGRAPH_GITHUB_ENTERPRISE_PROXY_URL: http://github-enterprise-egress:8080
    depends_on:
      github-enterprise-egress: {condition: service_healthy}
  worker:
    environment:
      WORKGRAPH_GITHUB_ENABLED: "true"
      WORKGRAPH_GITHUB_ALLOWLIST: ${GITMORA_GITHUB_ENTERPRISE_URL:?Set the exact Enterprise HTTPS web base}
      WORKGRAPH_GITHUB_ENTERPRISE_PROXY_URL: http://github-enterprise-egress:8080
    depends_on:
      github-enterprise-egress: {condition: service_healthy}
  github-enterprise-egress:
    image: ${WORKGRAPH_IMAGE:-gitmora:local}
    command: [egress, --listen, "0.0.0.0:8080", --target, "${GITMORA_GITHUB_ENTERPRISE_AUTHORITY:?Set the Enterprise host:port}", --visibility, "${GITMORA_GITHUB_ENTERPRISE_VISIBILITY:-public}"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    networks: [private, github_enterprise_outbound]
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: [CMD, /gitmorad, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  github_enterprise_outbound:
