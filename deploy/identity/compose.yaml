name: gitmora-identity
services:
  postgres:
    image: ${GITMORA_POSTGRES_IMAGE:-gitmora-postgres:18.6-vector1}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets: [postgres_password, app_password]
    volumes: ["database:/var/lib/postgresql", "./10-keycloak.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro"]
    networks: [private]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    shm_size: 64m
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, postgres, -d, postgres]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  identity:
    image: ${GITMORA_IDENTITY_IMAGE:?Set a prebuilt optimized identity image}
    user: "1000:0"
    # Keep heap growth bounded on a shared host; the 2 GiB limit also reserves native/JVM overhead.
    environment: {JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"}
    command: ["--config-file=/run/secrets/keycloak.conf", start, --optimized, --import-realm]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,mode=1777", "/opt/keycloak/data:rw,noexec,nosuid,size=128m,uid=1000,gid=0,mode=0750"]
    volumes:
      - "${GITMORA_IDENTITY_STATE:?}/${GITMORA_IDENTITY_IMPORT:?}:/opt/keycloak/data/import:ro"
      - "${GITMORA_IDENTITY_STATE:?}/secrets/${GITMORA_IDENTITY_CONFIG:?}:/run/secrets/keycloak.conf:ro"
    networks: [private]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck:
      test: [CMD, /bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; IFS= read -r status <&3; [[ \"$$status\" == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  gateway:
    image: ${GITMORA_IDENTITY_GATEWAY_IMAGE:?Set the prebuilt Gitmora gateway image}
    command: [gateway, --listen, "0.0.0.0:8080", --upstream, "http://identity:8080", --public-origin, "${GITMORA_IDENTITY_PUBLIC_ORIGIN:?}", --identity-prefix, "${GITMORA_IDENTITY_PREFIX-}"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    networks: [private, ingress]
    ports: ["127.0.0.1:${GITMORA_IDENTITY_HTTP_PORT:-18081}:8080"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    depends_on: {identity: {condition: service_healthy}}
    healthcheck:
      test: [CMD, /gitmorad, healthcheck, --url, "http://127.0.0.1:8080${GITMORA_IDENTITY_PREFIX-}/realms/${GITMORA_IDENTITY_REALM:-gitmora}/.well-known/openid-configuration", --oidc-issuer, "${GITMORA_IDENTITY_PUBLIC_URL:?}/realms/${GITMORA_IDENTITY_REALM:-gitmora}"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 10s
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
volumes: {database: {}}
networks:
  private: {internal: true}
  ingress: {}
secrets:
  postgres_password: {file: "${GITMORA_IDENTITY_STATE:?}/secrets/postgres_password"}
  app_password: {file: "${GITMORA_IDENTITY_STATE:?}/secrets/app_password"}
