# Authentication proofs, query text, cookies and authorization headers never enter this access log.
log_format gitmora_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
map $uri $gitmora_loggable {
    default 1;
    ~^/auth(?:/|$) 0;
}
limit_req_zone $binary_remote_addr zone=gitmora_requests:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name gitmora.tasktopia.online;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/gitmora/acme;
        try_files $uri =404;
    }
    location / { return 308 https://gitmora.tasktopia.online$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gitmora.tasktopia.online;
    ssl_certificate /etc/letsencrypt/live/gitmora.tasktopia.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitmora.tasktopia.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/gitmora.access.log gitmora_access if=$gitmora_loggable;
    error_log /var/log/nginx/gitmora.error.log warn;
    client_max_body_size 4m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    if ($host != gitmora.tasktopia.online) { return 421; }
    limit_req zone=gitmora_requests burst=128 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Original-URL "";
    proxy_set_header X-Original-Method "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 65s;
    proxy_send_timeout 20s;
    proxy_buffering off;

    # Immutable native releases contain only reviewed public binaries and manifests.
    location ^~ /downloads/cli/ {
        root /srv/gitmora-public;
        autoindex off;
        disable_symlinks on from=$document_root;
        limit_except GET { deny all; }
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location = /auth {
        access_log off;
        return 308 https://gitmora.tasktopia.online/auth/;
    }
    location = /auth/ {
        access_log off;
        return 303 https://gitmora.tasktopia.online/v1/auth/login;
    }
    location ^~ /auth/realms/gitmora/ {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 256k;
        if ($uri ~ "[%\\\\]") { return 404; }
        proxy_redirect off;
        proxy_pass http://127.0.0.1:18081/auth/realms/gitmora/;
    }
    location ^~ /auth/resources/ {
        access_log off;
        error_log /dev/null crit;
        if ($uri ~ "[%\\\\]") { return 404; }
        proxy_redirect off;
        proxy_pass http://127.0.0.1:18081/auth/resources/;
    }
    location ^~ /auth/ {
        access_log off;
        error_log /dev/null crit;
        return 404;
    }

    location ^~ /v1/auth/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
